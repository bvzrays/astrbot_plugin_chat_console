    html[data-theme="dark"] .isolation-warning{border-color:#705d36;background:#30291b;color:#e0bd71}html[data-theme="dark"] .left,html[data-theme="dark"] .chat{background:#151a21}html[data-theme="dark"] .account,html[data-theme="dark"] .chat-head,html[data-theme="dark"] .composer{background:#1b2028}html[data-theme="dark"] .window{border-color:#252c36}html[data-theme="dark"] .group:hover{background:#222a35}html[data-theme="dark"] .group.active,html[data-theme="dark"] .group.pinned.active{background:#24364b}html[data-theme="dark"] .group.pinned{background:#29261f;box-shadow:inset 3px 0 #bc9147}html[data-theme="dark"] .group-avatar,html[data-theme="dark"] .adapter-mark,html[data-theme="dark"] .search-box,html[data-theme="dark"] .composer textarea{background:#252d38;color:var(--text)}html[data-theme="dark"] .group-badge,html[data-theme="dark"] .group-badge.auto-on{background:#20382d;color:#81d5a2}html[data-theme="dark"] .group-badge.off,html[data-theme="dark"] .group-badge.auto-off,html[data-theme="dark"] .group-badge.passive{background:#2a313a;color:#a6b0bd}html[data-theme="dark"] .group-badge.auto-unknown{background:#393223;color:#e0bd71}html[data-theme="dark"] .group-badge.mention,html[data-theme="dark"] .mention-button{background:#3a2631;color:#f08db0}html[data-theme="dark"] .bubble{background:#242b35;color:var(--text)}html[data-theme="dark"] .quote{background:#1a222d;color:#b3bdc9}html[data-theme="dark"] .quote strong{color:#d0d9e4}html[data-theme="dark"] .media-link,html[data-theme="dark"] .icon-btn:hover,html[data-theme="dark"] .context-menu button:hover{background:#27374a;color:#8fc4ff}html[data-theme="dark"] .context-menu,html[data-theme="dark"] .media-modal-card,html[data-theme="dark"] .adapter-menu{background:#1d242d;color:var(--text)}html[data-theme="dark"] .modal-actions button{background:#2a323d;color:var(--text)}html[data-theme="dark"] .system-empty{color:var(--muted)}
    html[data-theme="dark"] .jump-button{border-color:#34465a;background:#202f40;color:#8fc4ff}html[data-theme="dark"] .jump-button:hover{background:#283d53}html[data-theme="dark"] .day:before,html[data-theme="dark"] .day:after{background:#303844}html[data-theme="dark"] .unread-divider{color:#f08da6}html[data-theme="dark"] .unread-divider:before,html[data-theme="dark"] .unread-divider:after{background:#55313b}html[data-theme="dark"] .avatar,html[data-theme="dark"] .avatar-fallback{background:#293441;color:#b7c9da}html[data-theme="dark"] .mention-label{background:#3a2631;color:#f08db0}html[data-theme="dark"] .remark-input{background:#202832;color:var(--text)}html[data-theme="dark"] .composer textarea:focus{background:#202832}html[data-theme="dark"] .pending{border-color:#303844;background:#202832}html[data-theme="dark"] .boot{background:#11151bf2}html[data-theme="dark"] .spinner{border-color:#303844;border-top-color:var(--accent)}html[data-theme="dark"] .modal-actions .primary{background:var(--accent);color:#fff}

  <style>
    .group-statuses{display:flex;align-items:center;gap:5px;min-width:0}.group-badge.passive{background:#f0f2f5;color:#838e9e}.group-badge.auto-on{background:#e8f7ee;color:#21945a}.group-badge.auto-off{background:#eef1f5;color:#929dab}.group-badge.auto-unknown{background:#f5f1e8;color:#a07735}.group-badge.mention{background:#fff0f5;color:#c04770}.group .group-foot{gap:6px}.group .unread{margin-left:auto}.message.jump-highlight .bubble{animation:jump-highlight 1.5s ease-out}@keyframes jump-highlight{0%,40%{box-shadow:0 0 0 3px #70b8f5,0 4px 14px #1f76b62e}100%{box-shadow:0 1px 2px #1e2d410f}}.chat-head{gap:10px}.jump-button[hidden],.mention-button[hidden]{display:none}@media(max-width:760px){.chat-head{padding:0 10px}.chat-actions{gap:3px}.jump-button,.mention-button{max-width:115px;padding:0 7px;overflow:hidden;text-overflow:ellipsis}.chat-sub{max-width:45vw}.group-statuses{flex-wrap:wrap}.group-foot{align-items:flex-start!important}}

<body>
<main class="app"><div class="window">
  <aside class="left"><header class="account"><button id="account-button" class="account-button" type="button" aria-expanded="false"><span id="account-avatar" class="account-avatar">聊</span><span class="account-copy"><span id="account-name" class="account-name">正在连接适配器</span><span class="account-meta"><i id="account-dot" class="online off"></i><span id="account-meta">连接中</span></span></span><span class="chevron">⌄</span></button><div id="adapter-menu" class="adapter-menu"></div></header><div class="search"><label class="search-box"><span>⌕</span><input id="search" placeholder="搜索群聊" autocomplete="off"></label></div><div id="isolation-warning" class="isolation-warning" hidden>检测到 AstrBot 开启了群聊会话隔离。若想将同群成员会话合并为一个聊天栏，请在插件配置启用“合并隔离会话”。</div><div class="section-head"><span>群聊</span><span class="live">● 实时同步</span></div><div id="groups" class="groups"></div><div class="hint">右键群聊可置顶或修改备注 · 新消息自动更新</div></aside>
  <section class="chat"><header class="chat-head"><div class="chat-heading"><div id="chat-title" class="chat-title">选择一个群聊</div><div id="chat-sub" class="chat-sub">从左侧选择会话开始查看</div></div><div class="chat-actions"><button id="unread-jump" class="jump-button" type="button" hidden></button><button id="mention-jump" class="mention-button" type="button" hidden></button><button id="refresh" class="icon-btn" title="刷新消息" type="button">↻</button><button id="theme-toggle" class="icon-btn" type="button" title="切换深色/浅色模式" aria-label="切换深色/浅色模式">☀</button></div></header><div id="messages" class="messages"><div class="system-empty">消息将在这里显示</div></div><form id="composer" class="composer"><div id="pending" class="pending"><img id="pending-thumb" class="pending-thumb" alt=""><span class="pending-copy"><span id="pending-name" class="pending-name"></span><span>图片待发送，可继续输入文字</span></span><button id="pending-remove" class="pending-remove" type="button" title="移除图片">×</button></div><button id="pick-image" class="icon-btn" title="选择图片" type="button">＋</button><input id="image-input" type="file" accept="image/*" hidden><textarea id="input" rows="1" placeholder="发送消息到当前群聊" disabled></textarea><button id="send" class="send" type="submit" disabled>发送</button></form></section>
  <div id="boot" class="boot"><div class="boot-box"><div class="spinner" id="spinner"></div><b id="boot-title">正在连接适配器</b><div id="boot-detail" class="boot-detail">正在读取当前可用的机器人账号</div><button id="retry" class="retry" type="button">重新连接</button></div></div>
</div></main><div id="notice" class="notice" hidden></div><div id="context-menu" class="context-menu"><button id="pin-group" type="button">置顶群聊</button><button id="remark-group" type="button">修改群备注</button><button id="read-group" type="button">标为已读</button><button id="delete-group" class="danger" type="button">删除会话</button></div><div id="profile-modal" class="profile-modal"><div class="profile-card"><div class="profile-head"><img id="profile-avatar" class="profile-avatar" alt=""><div><div id="profile-title" class="profile-title">群成员资料</div><div id="profile-sub" class="profile-sub"></div></div></div><div id="profile-lines" class="profile-lines"></div><div class="modal-actions"><button id="profile-close" class="primary" type="button">关闭</button></div></div></div><div id="media-modal" class="media-modal"><div class="media-modal-card"><img id="modal-image" alt="图片预览"><div class="modal-actions"><button id="modal-close" type="button">关闭</button><button id="modal-open" class="primary" type="button">打开公网链接</button></div></div></div>
<script>
const bridge=window.AstrBotPluginPage,$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])),initials=v=>String(v||"聊").trim().slice(0,2).toUpperCase(),THEME_KEY="astrbot-chat-console-theme";
function applyTheme(dark){document.documentElement.dataset.theme=dark?"dark":"light";$("theme-toggle").textContent=dark?"☾":"☀";$("theme-toggle").title=dark?"切换到浅色模式":"切换到深色模式";$("theme-toggle").setAttribute("aria-label",$("theme-toggle").title)}
function readThemePreference(){return window.__astrbotChatConsoleTheme||null}
function saveThemePreference(theme){window.__astrbotChatConsoleTheme=theme}
async function initializeTheme(){
  try{settings=await bridge.apiGet("settings")}catch(error){console.warn("chat console settings unavailable",error)}
  const saved=readThemePreference();applyTheme(saved===null?settings.dark_mode!==false:saved==="dark");
  const warning=$("isolation-warning");warning.hidden=!settings.session_isolation_enabled;
  warning.textContent=settings.merge_isolated_sessions?"AstrBot 已开启群聊会话隔离；聊天控制台正在把同群成员会话合并显示。":"检测到 AstrBot 开启了群聊会话隔离。同群消息会按成员分开；如需合并，请在插件配置启用“合并隔离会话”。";
}
function pageClientId(){
